services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: production
      APP_TITLE: ${APP_TITLE:-mastra}
      PORT: ${PORT:-4111}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL}
      LOCAL_STABLEDIFFUSION_URL: ${LOCAL_STABLEDIFFUSION_URL}
    ports:
      - '127.0.0.1:${PORT:-4111}:${PORT:-4111}'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:${PORT:-4111}/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env or the environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  postgres_data:
